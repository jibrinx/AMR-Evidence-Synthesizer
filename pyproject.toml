[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "amr-evidence-synthesizer"
version = "0.1.0"
description = "Supervised, source-grounded Nigerian AMR evidence extraction"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.41,<2",
  "pydantic>=2.10,<3",
  "requests>=2.32,<3",
  "pdfplumber>=0.11,<0.12",
  "defusedxml>=0.7,<0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
